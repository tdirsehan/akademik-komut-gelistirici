name: Rename app title

on:
  push:
    paths:
      - '.github/workflows/rename-title.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename title in app and README
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['index.html', 'README.md']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace('Academic Prompt Builder', 'Academic Prompt Generator')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git rm .github/workflows/rename-title.yml
          git commit -m "Rename app to Academic Prompt Generator"
          git push
