name: Polish UI v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-ui-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve visual hierarchy and colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* UI-POLISH-V2 */'
          if marker not in s:
              css="""/* UI-POLISH-V2 */
          body{background:linear-gradient(180deg,#eef4ff 0,#f8fafc 240px,#f6f7fb 100%)}
          header{background:linear-gradient(135deg,#0f172a,#1e3a8a 58%,#2563eb);color:#fff;border-bottom:0;box-shadow:0 10px 30px #0f172a22}
          header h1{font-size:27px;letter-spacing:-.02em}header .sub{color:#dbeafe;font-size:13px}
          header select,header button{border-color:#ffffff35;background:#ffffff14;color:#fff;backdrop-filter:blur(8px)}header select option{color:#172033;background:#fff}header button:hover{background:#ffffff25}
          .grid{gap:22px;padding-top:24px}.card{border:0;box-shadow:0 14px 40px #0f172a10;border-radius:20px}
          .field{padding:14px 14px 12px;border:1px solid #e8edf5;border-left:5px solid #cbd5e1;border-radius:14px;background:#fff;transition:.18s ease}.field:focus-within{transform:translateY(-1px);box-shadow:0 8px 22px #2563eb12;border-color:#bfdbfe}
          .field:nth-of-type(1){border-left-color:#2563eb;background:#f8fbff}.field:nth-of-type(2){border-left-color:#7c3aed;background:#fbf9ff}.field:nth-of-type(3){border-left-color:#0891b2;background:#f7fdff}.field:nth-of-type(4){border-left-color:#0f766e;background:#f7fdfa}.field:nth-of-type(5){border-left-color:#16a34a;background:#f8fdf8}.field:nth-of-type(6){border-left-color:#d97706;background:#fffaf3}.field:nth-of-type(7){border-left-color:#db2777;background:#fff8fc}.field:nth-of-type(8){border-left-color:#dc2626;background:#fff8f8}
          .fh label{font-size:14px;letter-spacing:.01em}.tag{font-weight:800}.field:nth-of-type(2) .tag{background:#f3e8ff;color:#6d28d9}.field:nth-of-type(3) .tag{background:#cffafe;color:#0e7490}.field:nth-of-type(4) .tag{background:#ccfbf1;color:#0f766e}.field:nth-of-type(5) .tag{background:#dcfce7;color:#15803d}.field:nth-of-type(6) .tag{background:#ffedd5;color:#c2410c}.field:nth-of-type(7) .tag{background:#fce7f3;color:#be185d}.field:nth-of-type(8) .tag{background:#fee2e2;color:#b91c1c}
          textarea,select,input{border-color:#d8e0eb;box-shadow:inset 0 1px 2px #0f172a08}textarea:focus,select:focus,input:focus{outline:3px solid #2563eb18;border-color:#60a5fa}
          .right{background:linear-gradient(180deg,#fff,#fbfdff)}.score{width:72px;height:72px;border-width:8px;font-size:20px;background:#f8fbff}.progress{height:9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.checks li{margin:0;padding:7px 9px;border-radius:9px;background:#f8fafc;border:1px solid #eef2f7}
          .outTitle,.aiTitle{display:flex;align-items:center;gap:8px}.outTitle:before,.aiTitle:before{content:'';width:8px;height:8px;border-radius:50%;background:#2563eb}.aiTitle:before{background:#7c3aed}
          .output{background:linear-gradient(180deg,#111827,#0f172a);border:1px solid #263244;box-shadow:inset 0 1px #ffffff0d,0 8px 22px #0f172a10}
          .generate{box-shadow:0 10px 24px #2563eb35}.generate:hover{transform:translateY(-1px);filter:brightness(1.03)}
          .sectionActions button{flex:1;min-width:120px}.aiGrid .ai{border:0;color:#fff;box-shadow:0 6px 16px #0f172a12}.aiGrid .ai:nth-child(1){background:linear-gradient(135deg,#10a37f,#087f64)}.aiGrid .ai:nth-child(2){background:linear-gradient(135deg,#4285f4,#8e5cf6)}.aiGrid .ai:nth-child(3){background:linear-gradient(135deg,#d97757,#b85f43)}.aiGrid .ai:nth-child(4){background:linear-gradient(135deg,#111827,#334155)}.aiGrid .ai:hover{transform:translateY(-1px);filter:brightness(1.04)}
          .reliabilityBanner{border:0;background:linear-gradient(135deg,#eff6ff,#eef2ff);box-shadow:inset 4px 0 #2563eb}.tip{background:#fff;border-style:solid;border-color:#e6ebf2}
          footer{text-align:center;padding-top:8px;padding-bottom:30px}
          @media(max-width:600px){header h1{font-size:23px}.field{padding:12px}.checks{grid-template-columns:1fr}.score{width:64px;height:64px}.sectionActions button{width:100%}}
          """
              css='\n'.join(line.strip() for line in css.splitlines())
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Polish UI with clearer hierarchy and colors"
            git push
          fi
