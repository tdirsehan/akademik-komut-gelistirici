name: Rename transfer page
on:
  push:
    paths:
      - '.github/workflows/rename-transfer-page.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename internal transfer page
        run: |
          mv ai-komut-kodu.html prompt-transfer.html
          sed -i 's/ai-komut-kodu\.html/prompt-transfer.html/g' index.html
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/rename-transfer-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename AI transfer page in English"
          git push
