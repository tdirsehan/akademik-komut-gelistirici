name: Neon 3D redesign
on:
  push:
    paths:
      - '.github/workflows/neon-redesign.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        run: python3 .github/neon_redesign.py
      - name: Commit redesign and clean temporary files
        run: |
          rm -f .github/workflows/neon-redesign.yml .github/neon_redesign.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-komut-kodu.html .github/workflows/neon-redesign.yml .github/neon_redesign.py
          git commit -m "Redesign Academic Prompt Generator with neon 3D UI"
          git push
