name: Neon 3D redesign
on:
  push:
    paths:
      - '.github/workflows/neon-redesign.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply neon 3D visual system
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('<meta name="theme-color" content="#2563eb">','<meta name="theme-color" content="#080815">')
          s = s.replace('A structured tool for developing academic and professional AI prompts','Design high-performance academic prompts with structured reasoning, evidence controls, and reliability checks')
          css = r'''
<style id="neon-3d-v4">
:root{
  --n-bg:#070713;--n-panel:rgba(15,18,36,.82);--n-panel2:rgba(10,13,29,.94);
  --n-text:#f4f7ff;--n-muted:#9ba9c7;--n-cyan:#38f9ff;--n-blue:#5c7cff;
  --n-violet:#b75cff;--n-pink:#ff4fd8;--n-green:#63ffbb;--n-line:rgba(116,144,255,.22);
  --n-glow:0 0 24px rgba(56,249,255,.18),0 0 70px rgba(183,92,255,.12);
}
html{background:var(--n-bg)}
body{
  min-height:100vh;color:var(--n-text);background:
  radial-gradient(circle at 12% 8%,rgba(56,249,255,.13),transparent 26%),
  radial-gradient(circle at 88% 13%,rgba(183,92,255,.18),transparent 28%),
  radial-gradient(circle at 52% 86%,rgba(255,79,216,.08),transparent 26%),
  linear-gradient(145deg,#05050d 0%,#090b19 50%,#060611 100%);
  overflow-x:hidden;
}
body:before,body:after{content:'';position:fixed;z-index:-1;border-radius:999px;filter:blur(60px);pointer-events:none;opacity:.55}
body:before{width:360px;height:360px;left:-130px;top:20vh;background:rgba(56,249,255,.16);animation:orbFloat 11s ease-in-out infinite}
body:after{width:420px;height:420px;right:-150px;top:48vh;background:rgba(183,92,255,.15);animation:orbFloat 13s ease-in-out infinite reverse}
@keyframes orbFloat{50%{transform:translate3d(0,38px,0) scale(1.08)}}
header{
  background:linear-gradient(120deg,rgba(9,12,27,.94),rgba(17,15,43,.91) 55%,rgba(8,26,43,.9));
  border-bottom:1px solid rgba(56,249,255,.18);box-shadow:0 18px 55px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.04) inset;
  backdrop-filter:blur(22px) saturate(150%);padding:21px 18px;
}
header:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--n-cyan),var(--n-violet),transparent);opacity:.72;box-shadow:0 0 18px var(--n-cyan)}
header h1{font-size:29px;color:#fff;text-shadow:0 0 20px rgba(56,249,255,.24),0 0 36px rgba(183,92,255,.18);letter-spacing:-.035em}
header .sub{color:#b9c7e5;max-width:650px;line-height:1.45}
header select,header button{background:rgba(10,14,32,.68)!important;border:1px solid rgba(109,139,255,.3)!important;color:#edf4ff!important;box-shadow:0 8px 24px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.025) inset}
header button:hover{border-color:rgba(56,249,255,.58)!important;box-shadow:0 0 18px rgba(56,249,255,.16),0 10px 28px rgba(0,0,0,.3)}
header select option{background:#0b0d1a;color:#fff}
.grid{max-width:1260px;padding-top:28px;perspective:1300px}
.card{
  position:relative;background:linear-gradient(155deg,rgba(18,21,42,.88),rgba(8,11,25,.92));
  border:1px solid var(--n-line);box-shadow:0 28px 75px rgba(0,0,0,.42),0 0 40px rgba(92,124,255,.06),inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(24px) saturate(145%);border-radius:24px;color:var(--n-text);
}
.card:before{content:'';position:absolute;inset:0;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(56,249,255,.35),rgba(183,92,255,.18),transparent 55%,rgba(255,79,216,.14));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.65}
.field{
  position:relative;background:linear-gradient(145deg,rgba(20,24,47,.82),rgba(10,13,29,.9))!important;
  border:1px solid rgba(113,137,214,.2)!important;border-left:1px solid rgba(113,137,214,.2)!important;
  border-radius:16px;color:var(--n-text);box-shadow:0 12px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035);
  transform:translateZ(0);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.field:before{content:'';position:absolute;left:-1px;top:13px;bottom:13px;width:3px;border-radius:9px;background:linear-gradient(180deg,var(--n-cyan),var(--n-violet));box-shadow:0 0 14px rgba(56,249,255,.5)}
.field:nth-of-type(2n):before{background:linear-gradient(180deg,var(--n-violet),var(--n-pink));box-shadow:0 0 14px rgba(183,92,255,.48)}
.field:focus-within{transform:translateY(-3px) translateZ(18px);border-color:rgba(56,249,255,.45)!important;box-shadow:0 20px 42px rgba(0,0,0,.28),0 0 26px rgba(56,249,255,.1),inset 0 1px 0 rgba(255,255,255,.06)}
.fh label{color:#f5f7ff;font-weight:850}.tag{background:rgba(56,249,255,.09)!important;color:#80fbff!important;border:1px solid rgba(56,249,255,.2);box-shadow:0 0 12px rgba(56,249,255,.06);letter-spacing:.04em}
textarea,select,input{background:rgba(5,8,19,.76)!important;color:#eef3ff!important;border:1px solid rgba(117,142,220,.23)!important;box-shadow:inset 0 2px 9px rgba(0,0,0,.24)!important}
textarea::placeholder,input::placeholder{color:#7584a5}
textarea:focus,select:focus,input:focus{outline:2px solid rgba(56,249,255,.12)!important;border-color:rgba(56,249,255,.55)!important;box-shadow:0 0 0 4px rgba(56,249,255,.055),0 0 18px rgba(56,249,255,.08),inset 0 2px 9px rgba(0,0,0,.25)!important}
select option{background:#0b0e1d;color:#f1f5ff}
.tip,.reliabilityBanner{background:linear-gradient(145deg,rgba(13,18,38,.82),rgba(9,12,28,.88));color:#aebdde;border:1px solid rgba(101,128,213,.2);box-shadow:inset 0 1px rgba(255,255,255,.035),0 12px 28px rgba(0,0,0,.18)}
.reliabilityBanner{color:#bcefff;border-color:rgba(56,249,255,.2);box-shadow:inset 3px 0 var(--n-cyan),0 12px 28px rgba(0,0,0,.18),0 0 24px rgba(56,249,255,.045)}
.reliabilityBanner strong{color:#e8ffff;text-shadow:0 0 13px rgba(56,249,255,.2)}
.generate,.primary{
  position:relative;overflow:hidden;background:linear-gradient(105deg,#2adce5 0%,#6574ff 45%,#b95cff 100%)!important;border:0!important;color:white!important;
  box-shadow:0 15px 35px rgba(74,91,255,.24),0 0 28px rgba(56,249,255,.13),inset 0 1px 0 rgba(255,255,255,.28)!important;
  text-shadow:0 1px 4px rgba(0,0,0,.24);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
}
.generate:after,.primary:after{content:'';position:absolute;top:-60%;left:-30%;width:25%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transform:rotate(18deg);transition:left .5s ease}
.generate:hover,.primary:hover{transform:translateY(-3px) scale(1.005);filter:saturate(1.14);box-shadow:0 20px 42px rgba(74,91,255,.32),0 0 34px rgba(56,249,255,.18)!important}
.generate:hover:after,.primary:hover:after{left:115%}
.right{background:linear-gradient(160deg,rgba(16,19,39,.93),rgba(7,10,23,.95));transform-style:preserve-3d}
.score{border:0;background:radial-gradient(circle at 38% 30%,#283453,#0b0e1d 72%);color:#fff;box-shadow:0 16px 30px rgba(0,0,0,.35),0 0 0 3px rgba(56,249,255,.16),0 0 25px rgba(56,249,255,.16),inset 0 0 22px rgba(183,92,255,.14);text-shadow:0 0 12px rgba(56,249,255,.5)}
.scoreText,.note,footer{color:var(--n-muted)}
.progress{background:rgba(255,255,255,.07);box-shadow:inset 0 1px 4px rgba(0,0,0,.45)}
.progress>div{background:linear-gradient(90deg,var(--n-cyan),var(--n-violet),var(--n-pink));box-shadow:0 0 14px rgba(56,249,255,.5)}
.checks li{color:#aab9d8;background:rgba(13,17,35,.72);border:1px solid rgba(103,129,204,.17);box-shadow:inset 0 1px rgba(255,255,255,.025)}
.checks li:before{color:var(--n-green);text-shadow:0 0 10px rgba(99,255,187,.65)}
.outTitle,.aiTitle{color:#f6f8ff}.outTitle:before{background:var(--n-cyan);box-shadow:0 0 14px var(--n-cyan)}.aiTitle:before{background:var(--n-violet);box-shadow:0 0 14px var(--n-violet)}
.output{background:linear-gradient(145deg,#060812,#0a0d1b 55%,#08091a);color:#dffaff;border:1px solid rgba(56,249,255,.16);box-shadow:inset 0 1px rgba(255,255,255,.035),inset 0 -20px 50px rgba(91,63,255,.04),0 18px 38px rgba(0,0,0,.34),0 0 30px rgba(56,249,255,.04)}
.sectionActions button{background:rgba(13,17,35,.9);color:#dbe6ff;border:1px solid rgba(115,140,218,.22);box-shadow:0 8px 20px rgba(0,0,0,.2);transition:.2s ease}
.sectionActions button:hover{transform:translateY(-2px);border-color:rgba(56,249,255,.45);box-shadow:0 12px 26px rgba(0,0,0,.28),0 0 18px rgba(56,249,255,.07)}
.aiGrid .ai{border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 12px 28px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.1)!important;transform:translateZ(0);transition:.2s ease}
.aiGrid .ai:nth-child(1){background:linear-gradient(135deg,#006f63,#12b8a0)!important}.aiGrid .ai:nth-child(2){background:linear-gradient(135deg,#2855d9,#865cff)!important}.aiGrid .ai:nth-child(3){background:linear-gradient(135deg,#8d4a32,#d97757)!important}.aiGrid .ai:nth-child(4){background:linear-gradient(135deg,#101322,#39425b)!important}
.aiGrid .ai:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 17px 32px rgba(0,0,0,.35),0 0 20px rgba(92,124,255,.11)!important}
.status{color:#7dffc6;text-shadow:0 0 10px rgba(99,255,187,.2)}
footer{padding-top:12px}
@media(max-width:850px){.right{transform:none}.grid{perspective:none}}
@media(max-width:600px){header h1{font-size:25px}.card{border-radius:19px}.card:before{border-radius:19px}}
@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}.field,.generate,.primary,.ai,.sectionActions button{transition:none!important}}
</style>
'''
          if 'id="neon-3d-v4"' not in s:
              s = s.replace('</head>', css + '\n</head>')
          index.write_text(s, encoding='utf-8')

          transfer = Path('ai-komut-kodu.html')
          t = transfer.read_text(encoding='utf-8')
          t = t.replace('<meta name="theme-color" content="#0f172a">','<meta name="theme-color" content="#080815">')
          t = t.replace('<title>Prompt Code</title>','<title>Prompt Transfer | Academic Prompt Generator</title>')
          transfer_css = r'''
<style id="neon-transfer-v4">
:root{--cyan:#38f9ff;--violet:#b75cff;--pink:#ff4fd8}
html{background:#060611}body{min-height:100vh;background:radial-gradient(circle at 10% 5%,rgba(56,249,255,.14),transparent 30%),radial-gradient(circle at 95% 25%,rgba(183,92,255,.17),transparent 32%),linear-gradient(145deg,#05050d,#0a0c1c 55%,#070713);color:#f4f7ff}
.card{background:linear-gradient(155deg,rgba(18,21,42,.9),rgba(8,11,25,.95));border:1px solid rgba(95,132,225,.24);box-shadow:0 28px 75px rgba(0,0,0,.46),0 0 42px rgba(56,249,255,.06),inset 0 1px rgba(255,255,255,.055);backdrop-filter:blur(22px);border-radius:24px}
.kicker{color:#75f9ff;text-shadow:0 0 12px rgba(56,249,255,.25)}h1{color:#fff;text-shadow:0 0 22px rgba(183,92,255,.2)}.sub{color:#9eacc9}
textarea{background:linear-gradient(145deg,#050711,#0b0e1d);color:#dcfbff;border:1px solid rgba(56,249,255,.18);box-shadow:inset 0 1px rgba(255,255,255,.035),0 18px 38px rgba(0,0,0,.34),0 0 28px rgba(56,249,255,.045)}
button{background:rgba(13,17,35,.9);color:#dce7ff;border:1px solid rgba(115,140,218,.25);box-shadow:0 10px 24px rgba(0,0,0,.24);transition:.2s ease}button:hover{transform:translateY(-2px);border-color:rgba(56,249,255,.5)}button.primary{background:linear-gradient(105deg,#2adce5,#6574ff 48%,#b95cff);border:0;box-shadow:0 15px 34px rgba(74,91,255,.26),0 0 26px rgba(56,249,255,.12)}
.status{color:#72ffc1;text-shadow:0 0 10px rgba(99,255,187,.2)}.notice{background:rgba(11,17,36,.82);color:#b9c9e7;border:1px solid rgba(56,249,255,.16);box-shadow:inset 3px 0 var(--cyan),0 12px 26px rgba(0,0,0,.18)}
</style>
'''
          if 'id="neon-transfer-v4"' not in t:
              t = t.replace('</head>', transfer_css + '\n</head>')
          transfer.write_text(t, encoding='utf-8')
          PY
      - name: Commit redesign and remove temporary workflow
        run: |
          rm -f .github/workflows/neon-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-komut-kodu.html .github/workflows/neon-redesign.yml
          git commit -m "Redesign Academic Prompt Generator with neon 3D UI"
          git push
